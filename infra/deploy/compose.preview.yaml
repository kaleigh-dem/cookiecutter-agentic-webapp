name: agentic-webapp-preview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE}
    init: true
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
      API_RATE_LIMIT_ANONYMOUS_MAX: ${API_RATE_LIMIT_ANONYMOUS_MAX}
      API_RATE_LIMIT_AUTHENTICATED_MAX: ${API_RATE_LIMIT_AUTHENTICATED_MAX}
      API_RATE_LIMIT_MAX_BUCKETS: ${API_RATE_LIMIT_MAX_BUCKETS:-}
      API_RATE_LIMIT_ROUTE_MAX: ${API_RATE_LIMIT_ROUTE_MAX}
      API_RATE_LIMIT_STORE: ${API_RATE_LIMIT_STORE}
      API_RATE_LIMIT_TENANT_MAX: ${API_RATE_LIMIT_TENANT_MAX}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS}
      API_TRUSTED_PROXY_HOPS: ${API_TRUSTED_PROXY_HOPS}
      AUTH_ACCESS_TOKEN_VERIFIER: ${AUTH_ACCESS_TOKEN_VERIFIER:-}
      AUTH_DEVELOPMENT_PERMISSIONS: ${AUTH_DEVELOPMENT_PERMISSIONS:-}
      AUTH_DEVELOPMENT_SUBJECT: ${AUTH_DEVELOPMENT_SUBJECT:-}
      AUTH_DEVELOPMENT_TENANT: ${AUTH_DEVELOPMENT_TENANT:-}
      AUTH_DEVELOPMENT_TOKEN: ${AUTH_DEVELOPMENT_TOKEN:-}
      AUTH_OIDC_ALLOWED_ALGORITHMS: ${AUTH_OIDC_ALLOWED_ALGORITHMS:-}
      AUTH_OIDC_AUDIENCE: ${AUTH_OIDC_AUDIENCE:-}
      AUTH_OIDC_CLOCK_SKEW_SECONDS: ${AUTH_OIDC_CLOCK_SKEW_SECONDS:-}
      AUTH_OIDC_DISCOVERY_CACHE_TTL_MS: ${AUTH_OIDC_DISCOVERY_CACHE_TTL_MS:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_JWKS_CACHE_TTL_MS: ${AUTH_OIDC_JWKS_CACHE_TTL_MS:-}
      AUTH_OIDC_PERMISSIONS_CLAIM: ${AUTH_OIDC_PERMISSIONS_CLAIM:-}
      AUTH_OIDC_REQUEST_TIMEOUT_MS: ${AUTH_OIDC_REQUEST_TIMEOUT_MS:-}
      AUTH_OIDC_SCOPE_CLAIM: ${AUTH_OIDC_SCOPE_CLAIM:-}
      AUTH_OIDC_SUBJECT_CLAIM: ${AUTH_OIDC_SUBJECT_CLAIM:-}
      AUTH_OIDC_TENANT_CLAIM: ${AUTH_OIDC_TENANT_CLAIM:-}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${API_NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION}
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: ${WORKER_IMAGE}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION}
      WORKER_DRAIN_TIMEOUT_MS: '25000'
      WORKER_OPERATIONS_PORT: '4001'
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: ${WEB_IMAGE}
    init: true
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
