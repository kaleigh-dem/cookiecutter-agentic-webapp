name: steadystack-production

services:
  api:
    image: ${API_IMAGE}
    init: true
    restart: always
    environment:
      API_PORT: ${API_PORT}
      API_RATE_LIMIT_ANONYMOUS_MAX: ${API_RATE_LIMIT_ANONYMOUS_MAX}
      API_RATE_LIMIT_AUTHENTICATED_MAX: ${API_RATE_LIMIT_AUTHENTICATED_MAX}
      API_RATE_LIMIT_ROUTE_MAX: ${API_RATE_LIMIT_ROUTE_MAX}
      API_RATE_LIMIT_STORE: ${API_RATE_LIMIT_STORE}
      API_RATE_LIMIT_TENANT_MAX: ${API_RATE_LIMIT_TENANT_MAX}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS}
      API_TRUSTED_PROXY_HOPS: ${API_TRUSTED_PROXY_HOPS}
      AUTH_ACCESS_TOKEN_VERIFIER: ${AUTH_ACCESS_TOKEN_VERIFIER}
      AUTH_OIDC_ALLOWED_ALGORITHMS: ${AUTH_OIDC_ALLOWED_ALGORITHMS}
      AUTH_OIDC_AUDIENCE: ${AUTH_OIDC_AUDIENCE}
      AUTH_OIDC_CLOCK_SKEW_SECONDS: ${AUTH_OIDC_CLOCK_SKEW_SECONDS}
      AUTH_OIDC_DISCOVERY_CACHE_TTL_MS: ${AUTH_OIDC_DISCOVERY_CACHE_TTL_MS}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
      AUTH_OIDC_JWKS_CACHE_TTL_MS: ${AUTH_OIDC_JWKS_CACHE_TTL_MS}
      AUTH_OIDC_PERMISSIONS_CLAIM: ${AUTH_OIDC_PERMISSIONS_CLAIM}
      AUTH_OIDC_REQUEST_TIMEOUT_MS: ${AUTH_OIDC_REQUEST_TIMEOUT_MS}
      AUTH_OIDC_SCOPE_CLAIM: ${AUTH_OIDC_SCOPE_CLAIM}
      AUTH_OIDC_SUBJECT_CLAIM: ${AUTH_OIDC_SUBJECT_CLAIM}
      AUTH_OIDC_TENANT_CLAIM: ${AUTH_OIDC_TENANT_CLAIM}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_VERSION: ${APP_VERSION}
      WEB_ORIGIN: ${WEB_ORIGIN}
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      app.steadystack/version: ${APP_VERSION}

  worker:
    image: ${WORKER_IMAGE}
    init: true
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_VERSION: ${APP_VERSION}
    labels:
      app.steadystack/version: ${APP_VERSION}

  web:
    image: ${WEB_IMAGE}
    init: true
    restart: always
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      app.steadystack/version: ${APP_VERSION}
