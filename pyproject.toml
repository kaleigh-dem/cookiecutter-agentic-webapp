[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cookiecutter-agentic-webapp-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cookiecutter>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
