name: Bootstrap Phase 3

on:
  push:
    branches: [agent/add-workspace-generators]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-workspace-generators

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @nx/plugin@23.1.0
      - run: >-
          pnpm nx g @nx/plugin:plugin tools/workspace-plugin
          --name=workspace-plugin
          --importPath=@agentic-webapp/workspace-plugin
          --linter=eslint
          --unitTestRunner=vitest
          --useProjectJson=true
          --skipFormat=true
          --no-interactive
      - run: >-
          pnpm nx g @nx/plugin:generator tools/workspace-plugin/src/generators/domain
          --name=domain
          --description="Generate a backend domain library"
          --unitTestRunner=vitest
          --skipFormat=true
          --no-interactive
      - run: >-
          pnpm nx g @nx/plugin:generator tools/workspace-plugin/src/generators/feature
          --name=feature
          --description="Generate a frontend feature library"
          --unitTestRunner=vitest
          --skipFormat=true
          --no-interactive
      - run: >-
          pnpm nx g @nx/plugin:generator tools/workspace-plugin/src/generators/job
          --name=job
          --description="Generate a worker job library"
          --unitTestRunner=vitest
          --skipFormat=true
          --no-interactive
      - run: >-
          pnpm nx g @nx/plugin:generator tools/workspace-plugin/src/generators/contract
          --name=contract
          --description="Generate a contract library"
          --unitTestRunner=vitest
          --skipFormat=true
          --no-interactive
      - run: pnpm format

      - name: Commit generated plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scaffold Phase 3 workspace plugin"
          git push origin HEAD:agent/add-workspace-generators
