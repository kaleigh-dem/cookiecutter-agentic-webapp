name: Generate lockfile

on:
  push:
    branches: [agent/adopt-nx-template]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adopt-nx-template

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add pnpm lockfile"
          git push origin HEAD:agent/adopt-nx-template
