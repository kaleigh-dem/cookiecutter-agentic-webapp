name: P12-01 final formatter

on:
  pull_request:
    paths:
      - .github/workflows/p12-01-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and remove workflow
        run: |
          pnpm exec prettier --write apps/api/src/app/security/oidc-access-token-verifier.ts
          rm .github/workflows/p12-01-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/app/security/oidc-access-token-verifier.ts .github/workflows/p12-01-final-format.yml
          git commit -m "chore: format OIDC verifier type fix"
          git push
