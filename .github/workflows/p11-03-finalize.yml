name: Finalize P11-03 worker composition

on:
  push:
    branches:
      - agent/p11-03-worker-composition

permissions:
  contents: write

concurrency:
  group: p11-03-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.13.1

      - name: Align roadmap, ADR, and deployment packaging
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}: {old!r}")
              file.write_text(content.replace(old, new))

          replace_once(
              "docs/TODO.md",
              "- [ ] **P11-03 Compose the deployed worker around generated jobs.**",
              "- [x] **P11-03 Compose the deployed worker around generated jobs.**",
          )
          replace_once(
              "tools/delivery/prepare-node-deploy.mjs",
              "      ['packages/contracts', 'dist/packages/contracts'],\n      ['packages/observability', 'dist/packages/observability'],",
              "      ['packages/contracts', 'dist/packages/contracts'],\n      ['packages/database', 'dist/packages/database'],\n      ['packages/observability', 'dist/packages/observability'],",
          )
          replace_once(
              "docs/adr/0010-worker-delivery.md",
              "Each process uses bounded batch size and bounded in-process concurrency; scaling is achieved by changing those limits or adding replicas rather than by allowing unbounded promises. Long-running handlers renew their lease before expiration.",
              "Each process uses bounded batch size and bounded in-process concurrency; scaling is achieved by changing those limits or adding replicas rather than by allowing unbounded promises. Long-running handlers renew their lease before expiration.\n\nThe deployed worker now polls this adapter, routes `agent-task.execute.v1` and `agent-task.execute.v2` through the generated handler, acknowledges successful execution, and quarantines unknown event types, unsupported versions, and invalid payloads. Unexpected handler failures retain their lease for crash-style recovery until P11-05 adds retry classification and backoff policy.",
          )
          replace_once(
              "docs/adr/0010-worker-delivery.md",
              "- P11-03 through P11-07 compose, execute, harden, observe, and prove this implemented delivery foundation.",
              "- P11-04 through P11-07 make execution stateful and idempotent, add retry policy, complete operations, and prove the workflow end to end.",
          )
          PY

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format touched files
        run: >-
          pnpm exec nx format:write --files=apps/worker/package.json,apps/worker/tsconfig.app.json,apps/worker/src/main.ts,apps/worker/src/delivery/dispatch.ts,apps/worker/src/delivery/dispatch.spec.ts,apps/worker/src/delivery/poller.ts,apps/worker/src/delivery/poller.spec.ts,tools/delivery/prepare-node-deploy.mjs,docs/TODO.md,docs/adr/0010-worker-delivery.md,pnpm-lock.yaml

      - name: Test worker delivery composition
        run: pnpm exec vitest run apps/worker/src/delivery

      - name: Typecheck worker
        run: pnpm exec nx run worker:typecheck

      - name: Build worker
        run: pnpm exec nx run worker:build

      - name: Commit generated and formatted updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker docs/TODO.md docs/adr/0010-worker-delivery.md tools/delivery/prepare-node-deploy.mjs pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(worker): finalize delivery composition"
          git push
