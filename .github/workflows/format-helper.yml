name: Format helper

on:
  pull_request:
    paths:
      - .github/workflows/format-helper.yml
      - tools/delivery/image-scan-policy.mjs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact Prettier output
        run: |
          npx --yes prettier@3.9.6 --write tools/delivery/image-scan-policy.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/delivery/image-scan-policy.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(delivery): format image scan policy"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
