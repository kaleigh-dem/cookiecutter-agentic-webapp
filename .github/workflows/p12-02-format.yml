name: Format P12-02 authentication files

on:
  push:
    branches:
      - agent/p12-02-browser-authentication-adapter
    paths:
      - .github/workflows/p12-02-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p12-02-browser-authentication-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            packages/web/features/agent-tasks/src/lib/authentication.ts \
            packages/web/features/agent-tasks/src/lib/authentication.spec.ts
      - run: |
          rm .github/workflows/p12-02-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format browser authentication adapter'
          git push origin HEAD:agent/p12-02-browser-authentication-adapter
