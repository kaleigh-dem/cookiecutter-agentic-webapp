name: Resolve P13-01 conflicts

on:
  push:
    branches:
      - agent/p13-01-image-supply-chain-artifacts

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/p13-01-image-supply-chain-artifacts

      - name: Merge main and resolve known documentation conflicts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "docs/TODO.md"
              "docs/delivery/containers-and-configuration.md"
              "docs/delivery/releases-and-previews.md"
            )

            for conflict in "${conflicts[@]}"; do
              allowed=false
              for path in "${expected[@]}"; do
                if [[ "$conflict" == "$path" ]]; then
                  allowed=true
                  break
                fi
              done
              if [[ "$allowed" != true ]]; then
                echo "Unexpected merge conflict: $conflict" >&2
                exit 1
              fi
            done

            for path in "${expected[@]}"; do
              if printf '%s\n' "${conflicts[@]}" | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
              fi
            done
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          todo = Path("docs/TODO.md")
          todo_text = todo.read_text()
          old = "- [ ] **P13-01 Add image and dependency supply-chain artifacts.**"
          new = "- [-] **P13-01 Add image and dependency supply-chain artifacts.**"
          if todo_text.count(old) != 1:
              raise SystemExit(f"Expected exactly one planned P13-01 marker, found {todo_text.count(old)}")
          todo.write_text(todo_text.replace(old, new, 1))

          containers = Path("docs/delivery/containers-and-configuration.md")
          containers_text = containers.read_text()
          replacement = """## Runtime and artifact ownership

          Images do not contain production secrets. The deployment platform must inject database credentials, telemetry endpoints, and provider-specific identity configuration at runtime.

          The repository release workflow generates image SBOMs, enforces the vulnerability policy, signs published digests, and publishes build-provenance and SBOM attestations. See [Image supply-chain artifacts](image-supply-chain.md). The deployment platform remains responsible for TLS termination, admission enforcement, OCI referrer retention, secret rotation, network policy, managed backups, and environment approval.
          """
          containers_text, count = re.subn(
              r"## Runtime ownership\n\nImages do not contain production secrets\..*\Z",
              replacement,
              containers_text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected one runtime ownership section, found {count}")
          containers.write_text(containers_text)

          releases = Path("docs/delivery/releases-and-previews.md")
          releases_text = releases.read_text()
          replacement = """The **Release images** workflow accepts a semantic version, target environment, and public API URL. Production runs consume the masked `PRODUCTION_ENVIRONMENT` contract, compare its public web values with the image build inputs, generate the plan, build all three versioned images, create an SPDX SBOM and vulnerability report for each image, and enforce the repository-owned severity and exception policy before publication. When image publication is enabled, the workflow pushes each validated image once, resolves its immutable digest, signs the digest, and publishes build-provenance and SBOM attestations. See [Image supply-chain artifacts](image-supply-chain.md) for the policy and verification commands.

          Image publication is not deployment approval. The environment owner must review the plan, backup identifier, scan evidence, and published digest references before applying it. Digest promotion between environments remains a separate release decision.

          ## Preview validation"""
          releases_text, count = re.subn(
              r"The \*\*Release images\*\* workflow.*?\n\n## Preview validation",
              replacement,
              releases_text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected one release workflow section, found {count}")
          releases.write_text(releases_text)
          PY

          git rm .github/workflows/resolve-p13-01-conflicts.yml
          git add docs/TODO.md docs/delivery/containers-and-configuration.md docs/delivery/releases-and-previews.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --check
          grep -Fq -- '- [-] **P13-01 Add image and dependency supply-chain artifacts.**' docs/TODO.md
          grep -Fq 'Image supply-chain artifacts' docs/delivery/containers-and-configuration.md
          grep -Fq 'create an SPDX SBOM and vulnerability report for each image' docs/delivery/releases-and-previews.md

          git commit -m "Resolve P13-01 conflicts with main"
          git push origin HEAD:agent/p13-01-image-supply-chain-artifacts
