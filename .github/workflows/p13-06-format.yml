name: Apply P13-06 formatting

on:
  push:
    branches:
      - agent/p13-06-release-metadata-rollback-evidence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/p13-06-release-metadata-rollback-evidence

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pinned formatter
        run: pnpm exec prettier --write tools/delivery/release-record.mjs tools/delivery/release-record.spec.mjs

      - name: Commit formatter output
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- tools/delivery/release-record.mjs tools/delivery/release-record.spec.mjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/delivery/release-record.mjs tools/delivery/release-record.spec.mjs
          git commit -m 'style(delivery): format release record validation'
          git push origin HEAD:agent/p13-06-release-metadata-rollback-evidence
