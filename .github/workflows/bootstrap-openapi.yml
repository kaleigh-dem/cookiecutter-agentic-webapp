name: Bootstrap OpenAPI artifacts

on:
  push:
    branches: [agent/add-openapi-contract-foundation]

permissions:
  contents: write

concurrency:
  group: bootstrap-openapi-contract-foundation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm contracts:generate
      - run: pnpm nx sync
      - run: pnpm format

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate OpenAPI contract artifacts"
          git push origin HEAD:agent/add-openapi-contract-foundation
