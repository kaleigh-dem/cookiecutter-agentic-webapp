name: Patch PR 5 generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: patch-pr5-generator
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'agent/add-openapi-contract-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Patch generator required-input detection
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          generator = Path('packages/contracts/scripts/generate.ts')
          text = generator.read_text()

          text = text.replace(
              "const packageRoot = path.resolve(process.cwd(), 'packages/contracts');",
              "const packageRoot = path.resolve(\n  process.env.CONTRACTS_PACKAGE_ROOT ??\n    path.join(process.cwd(), 'packages/contracts'),\n);",
          )

          marker = "function collectOperations(document: JsonObject): OpenApiOperation[] {"
          if 'function resolveLocalReference(' not in text:
              helpers = r'''function resolveLocalReference(
            document: JsonObject,
            value: JsonValue,
            label: string,
            stack: string[] = [],
          ): JsonObject {
            const object = asObject(value, label);
            const reference = object.$ref;
            if (typeof reference !== 'string') {
              return object;
            }
            if (!reference.startsWith('#')) {
              throw new Error(`Unresolved external reference in ${label}: ${reference}`);
            }
            if (stack.includes(reference)) {
              throw new Error(`Circular local reference in ${label}: ${reference}`);
            }

            const target = resolveLocalReference(
              document,
              resolveJsonPointer(document, reference.slice(1)),
              label,
              [...stack, reference],
            );
            const siblings = Object.fromEntries(
              Object.entries(object).filter(([key]) => key !== '$ref'),
            ) as JsonObject;
            return { ...target, ...siblings };
          }

          function parameterKey(parameter: JsonObject): string {
            const name = parameter.name;
            const location = parameter.in;
            if (typeof name !== 'string' || typeof location !== 'string') {
              throw new Error('OpenAPI parameters require string name and in fields.');
            }
            return `${location}:${name}`;
          }

          function collectEffectiveParameters(
            document: JsonObject,
            pathItem: JsonObject,
            operation: JsonObject,
            operationLabel: string,
          ): JsonObject[] {
            const parametersByKey = new Map<string, JsonObject>();
            const parameterSources = [pathItem.parameters, operation.parameters];

            for (const parameterSource of parameterSources) {
              if (!Array.isArray(parameterSource)) {
                continue;
              }
              for (const parameterValue of parameterSource) {
                const parameter = resolveLocalReference(
                  document,
                  parameterValue,
                  `${operationLabel} parameter`,
                );
                parametersByKey.set(parameterKey(parameter), parameter);
              }
            }

            return [...parametersByKey.values()];
          }

          '''
              if marker not in text:
                  raise SystemExit('collectOperations marker not found')
              text = text.replace(marker, helpers + marker, 1)

          text = text.replace(
              "    const pathItem = asObject(pathItemValue, `Path item ${routePath}`);",
              "    const pathItem = resolveLocalReference(\n      document,\n      pathItemValue,\n      `Path item ${routePath}`,\n    );",
          )

          operation_pattern = re.compile(
              r"      const operation = asObject\(\s*operationValue,\s*"
              r"`Operation \$\{method\.toUpperCase\(\)\} \$\{routePath\}`,\s*"
              r"\);\s*const operationId = operation\.operationId;"
          )
          new_operation = '''      const operationLabel = `${method.toUpperCase()} ${routePath}`;
              const operation = resolveLocalReference(
                document,
                operationValue,
                `Operation ${operationLabel}`,
              );
              const operationId = operation.operationId;'''
          text, operation_count = operation_pattern.subn(new_operation, text, count=1)
          if operation_count != 1 and 'const operationLabel =' not in text:
              raise SystemExit(f'operation block matches: {operation_count}')

          requiredness_pattern = re.compile(
              r"      const parameters = Array\.isArray\(operation\.parameters\)"
              r"[\s\S]*?"
              r"      const hasPathTemplate = routePath\.includes\('\{'\);"
          )
          new_requiredness = '''      const parameters = collectEffectiveParameters(
                document,
                pathItem,
                operation,
                operationLabel,
              );
              const hasRequiredParameter = parameters.some(
                (parameter) =>
                  parameter.required === true || parameter.in === 'path',
              );
              const requestBody = operation.requestBody;
              const resolvedRequestBody =
                requestBody === undefined
                  ? undefined
                  : resolveLocalReference(
                      document,
                      requestBody,
                      `${operationLabel} request body`,
                    );
              const hasRequiredBody = resolvedRequestBody?.required === true;
              const hasPathTemplate = routePath.includes('{');'''
          text, requiredness_count = requiredness_pattern.subn(
              new_requiredness,
              text,
              count=1,
          )
          if requiredness_count != 1 and 'const resolvedRequestBody =' not in text:
              raise SystemExit(f'requiredness block matches: {requiredness_count}')

          generator.write_text(text)
          PY

      - run: pnpm exec prettier --write packages/contracts/scripts/generate.ts
      - run: pnpm nx test contracts
      - run: pnpm contracts:check
      - run: pnpm contracts:compat

      - name: Commit generator fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/scripts/generate.ts
          git commit -m "Resolve referenced required client inputs"
          git push origin HEAD:agent/add-openapi-contract-foundation
