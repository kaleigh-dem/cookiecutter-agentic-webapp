name: Validate P11-05

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/p11-05-retry-dead-letter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/p11-05-retry-dead-letter
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finalize roadmap and ADR
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path('docs/TODO.md')
          text = todo.read_text()
          old = '- [ ] **P11-05 Add retry and dead-letter behavior.**'
          new = '- [x] **P11-05 Add retry and dead-letter behavior.**'
          if old not in text:
              raise SystemExit('P11-05 roadmap marker was not found')
          todo.write_text(text.replace(old, new, 1))

          adr = Path('docs/adr/0010-worker-delivery.md')
          text = adr.read_text()
          old = "Unexpected handler failures record bounded support metadata on the task and retain the outbox lease for crash-style recovery until P11-05 adds retry classification and backoff policy."
          new = "Handler failures are classified once for both task state and outbox disposition. Retryable failures leave the Agent Task resumable and return the outbox row to pending with bounded exponential backoff and jitter. Permanent failures and exhausted retryable failures transition the current fenced task attempt and outbox row to terminal failure using safe allowlisted metadata."
          if old not in text:
              raise SystemExit('ADR handler-failure paragraph was not found')
          text = text.replace(old, new, 1)
          old = "The delivery adapter provides guarded reschedule and terminal-failure transitions. P11-05 defines the policy that chooses between them, computes backoff, distinguishes quarantine from dead-letter outcomes, and exposes operator replay."
          new = "The deployed policy permits five delivery attempts. It starts from a one-second delay, doubles up to a 60-second cap, and applies downward jitter of up to 50 percent. Explicit retryable errors and known transient network or PostgreSQL failures are rescheduled. Explicit permanent errors, contract or execution-state conflicts, and programming errors are quarantined immediately. Unknown exceptions are treated as retryable so unclassified dependency failures do not destroy work on the first occurrence."
          if old not in text:
              raise SystemExit('ADR retry-policy placeholder was not found')
          text = text.replace(old, new, 1)
          old = "A retry or replay is another at-least-once delivery and must use the original message identifier. Operators may replay quarantined work only through an explicit command that records who initiated the replay and why."
          new = "A retry or replay is another at-least-once delivery and uses the original message identifier. Operators inspect failed rows through `pnpm outbox:list-failed` and replay one row through `pnpm outbox:replay` with required operator and reason fields. Replay preserves safe failure evidence, records replay count and audit metadata, resets the outbox attempt count for a new bounded cycle, and atomically returns a matching failed Agent Task to `queued` without regressing succeeded work. Detailed actions and alert thresholds are maintained in `docs/worker-retry-and-dead-letter.md`."
          if old not in text:
              raise SystemExit('ADR replay paragraph was not found')
          adr.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed files
        run: pnpm exec prettier --write apps/worker/src/delivery/dispatch.ts apps/worker/src/delivery/dispatch.spec.ts apps/worker/src/delivery/poller.ts apps/worker/src/delivery/poller.spec.ts apps/worker/src/delivery/retry-policy.ts apps/worker/src/delivery/retry-policy.spec.ts apps/worker/src/jobs/failure.ts apps/worker/src/jobs/failure.spec.ts apps/worker/src/jobs/execute-agent-task/contract.ts apps/worker/src/jobs/execute-agent-task/handler.ts apps/worker/src/jobs/execute-agent-task/handler.spec.ts apps/worker/src/jobs/execute-agent-task/stateful-handler.ts apps/worker/src/jobs/execute-agent-task/stateful-handler.spec.ts apps/worker/src/main.ts packages/database/migrations/20260802170000000_add_outbox_replay_metadata.ts packages/database/project.json packages/database/src/adapters/job-outbox-delivery.ts packages/database/src/adapters/job-outbox-delivery.integration.test.ts packages/database/src/adapters/job-outbox-replay.integration.test.ts packages/database/src/cli.ts packages/database/src/schema/agent-task.ts package.json docs/TODO.md docs/adr/0010-worker-delivery.md docs/worker-retry-and-dead-letter.md
      - run: pnpm exec nx sync:check
      - run: pnpm exec vitest run apps/worker/src --passWithNoTests
      - run: pnpm exec vitest run packages/database/src --passWithNoTests --testTimeout=120000 --hookTimeout=120000
      - run: pnpm exec nx run-many -t lint --projects=worker,database
      - run: pnpm exec nx run-many -t typecheck --projects=worker,database
      - run: pnpm exec nx run-many -t build --projects=worker,database
      - name: Commit validated branch
        run: |
          rm .github/workflows/validate-p11-05.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete P11-05 retry and dead-letter behavior"
          git push origin HEAD:agent/p11-05-retry-dead-letter
