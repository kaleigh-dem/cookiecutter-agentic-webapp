name: Run P13-02 digest promotion implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p13-02-digest-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p13-02-digest-promotion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Execute prepared implementation payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p13-02-apply.yml').read_text()
          marker = "      - name: Write P13-02 implementation\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n      - run: pnpm install --frozen-lockfile", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/p13-02-write.sh').write_text(script)
          PY
          bash /tmp/p13-02-write.sh

      - run: pnpm install --frozen-lockfile

      - name: Format focused change set
        run: >-
          pnpm exec prettier --write
          .github/workflows/release.yml
          .github/workflows/promote.yml
          package.json
          infra/release/release-manifest.example.json
          tools/delivery/release-manifest.mjs
          tools/delivery/release-manifest.spec.mjs
          tools/delivery/release-plan.mjs
          tools/delivery/release-plan.spec.mjs
          tools/delivery/release-promotion.spec.ts
          tools/delivery/production-readiness.spec.ts
          docs/TODO.md
          docs/adr/0013-image-supply-chain-artifacts.md
          docs/adr/0014-immutable-digest-promotion.md
          docs/delivery/containers-and-configuration.md
          docs/delivery/image-supply-chain.md
          docs/delivery/releases-and-previews.md
          docs/production-readiness.md

      - name: Run deterministic P13-02 checks
        run: |
          node --check tools/delivery/release-manifest.mjs
          node --check tools/delivery/release-plan.mjs
          pnpm release:manifest:check
          pnpm delivery:check
          pnpm nx test delivery --skip-nx-cache
          pnpm nx lint delivery --skip-nx-cache
          pnpm format:check

      - name: Commit focused implementation
        run: |
          rm .github/workflows/p13-02-apply.yml
          rm .github/workflows/p13-02-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(delivery): promote immutable release digests'
          git push origin HEAD:agent/p13-02-digest-promotion
