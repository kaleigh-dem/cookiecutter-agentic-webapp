name: P12-06 formatting

on:
  push:
    branches:
      - agent/p12-06-expand-security-verification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: pnpm exec prettier --write apps/api/src/app/security/security.integration.spec.ts
      - name: Remove temporary formatter and push
        run: |
          rm .github/workflows/p12-06-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/app/security/security.integration.spec.ts .github/workflows/p12-06-format.yml
          git diff --cached --quiet || git commit -m "style(security): format integration harness"
          git push origin HEAD:${{ github.ref_name }}
