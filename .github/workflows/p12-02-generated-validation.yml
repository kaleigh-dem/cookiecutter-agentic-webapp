name: Apply generated validation profile

on:
  push:
    branches:
      - agent/p12-02-browser-authentication-adapter
    paths:
      - .github/workflows/p12-02-generated-validation.yml
      - tools/p12-02-generated-validation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p12-02-browser-authentication-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/p12-02-generated-validation.py
      - run: pnpm exec prettier --write tools/template/generated-workspace-e2e.mjs
      - run: |
          rm .github/workflows/p12-02-generated-validation.yml tools/p12-02-generated-validation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Select production profile for generated validation'
          git push origin HEAD:agent/p12-02-browser-authentication-adapter
