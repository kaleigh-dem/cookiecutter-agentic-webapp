name: Validate P11-04 review fixes

on:
  pull_request:
    types: [synchronize]
  push:
    branches:
      - agent/p11-04-idempotent-stateful-handlers

permissions:
  contents: write

concurrency:
  group: p11-04-review-fixes
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply blocking review fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}: {old!r}")
              file.write_text(content.replace(old, new))

