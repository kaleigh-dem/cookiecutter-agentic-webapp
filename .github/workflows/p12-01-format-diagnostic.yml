name: P12-01 format diagnostic

on:
  pull_request:
    paths:
      - apps/api/src/app/security/oidc-access-token-verifier.ts
      - apps/api/src/app/security/oidc-access-token-verifier.spec.ts
      - docs/getting-started.md
      - docs/oidc-authentication.md
      - .github/workflows/p12-01-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatter diff
        run: |
          pnpm exec prettier --write \
            apps/api/src/app/security/oidc-access-token-verifier.ts \
            apps/api/src/app/security/oidc-access-token-verifier.spec.ts \
            docs/getting-started.md \
            docs/oidc-authentication.md
          git diff -- \
            apps/api/src/app/security/oidc-access-token-verifier.ts \
            apps/api/src/app/security/oidc-access-token-verifier.spec.ts \
            docs/getting-started.md \
            docs/oidc-authentication.md
