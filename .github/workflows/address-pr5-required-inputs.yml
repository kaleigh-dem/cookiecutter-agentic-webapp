name: Address PR 5 required inputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: address-pr5-required-inputs
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/add-openapi-contract-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preserve required generated request fields
        run: |
          python <<'PY'
          from pathlib import Path

          generator = Path('packages/contracts/scripts/generate.ts')
          text = generator.read_text()
          old = '''    'type RequestBody<T> = T extends { requestBody?: infer Body }',
              "  ? Body extends { content: { 'application/json': infer JsonBody } }",
              '    ? JsonBody',
              '    : never',
              '  : never;',
              '',
              'type OptionalField<Key extends string, Value> = [Value] extends [never]',
              '  ? { [Property in Key]?: never }',
              '  : { [Property in Key]?: Value };',
              '',
              'export type OperationRequest<T> = OptionalField<',
              "  'path',",
              "  ParameterGroup<T, 'path'>",
              '> &',
              '  OptionalField<',
              "    'query',",
              "    ParameterGroup<T, 'query'>",
              '  > &',
              '  OptionalField<',
              "    'headers',",
              "    ParameterGroup<T, 'header'>",
              '  > &',
              "  OptionalField<'body', RequestBody<T>> & {",
              '    readonly additionalHeaders?: HeadersInit;',
              '    readonly signal?: AbortSignal;',
              '  };','''
          new = '''    'type RequestBody<T> = T extends { requestBody?: infer Body }',
              '  ? [NonNullable<Body>] extends [never]',
              '    ? never',
              "    : NonNullable<Body> extends { content: { 'application/json': infer JsonBody } }",
              '      ? JsonBody',
              '      : never',
              '  : never;',
              '',
              'type RequiredKeys<T> = T extends object',
              '  ? {',
              '      [Key in keyof T]-?: {} extends Pick<T, Key> ? never : Key;',
              '    }[keyof T]',
              '  : never;',
              '',
              'type Field<',
              '  Key extends string,',
              '  Value,',
              '  IsRequired extends boolean,',
              '> = [Value] extends [never]',
              '  ? { [Property in Key]?: never }',
              '  : IsRequired extends true',
              '    ? { [Property in Key]: Value }',
              '    : { [Property in Key]?: Value };',
              '',
              'type ParameterField<',
              '  T,',
              '  GroupKey extends PropertyKey,',
              '  RequestKey extends string,',
              '> = Field<',
              '  RequestKey,',
              '  ParameterGroup<T, GroupKey>,',
              '  GroupKey extends RequiredKeys<ParametersOf<T>>',
              '    ? true',
              '    : [RequiredKeys<ParameterGroup<T, GroupKey>>] extends [never]',
              '      ? false',
              '      : true',
              '>;',
              '',
              'type BodyField<T> = Field<',
              "  'body',",
              '  RequestBody<T>,',
              "  'requestBody' extends RequiredKeys<T> ? true : false",
              '>;',
              '',
              'export type OperationRequest<T> = ParameterField<',
              '  T,',
              "  'path',",
              "  'path'",
              '> &',
              '  ParameterField<',
              '    T,',
              "    'query',",
              "    'query'",
              '  > &',
              '  ParameterField<',
              '    T,',
              "    'header',",
              "    'headers'",
              '  > &',
              '  BodyField<T> & {',
              '    readonly additionalHeaders?: HeadersInit;',
              '    readonly signal?: AbortSignal;',
              '  };','''
          if old not in text:
              raise SystemExit('generated request type block did not match')
          generator.write_text(text.replace(old, new, 1))
          PY

      - run: pnpm exec prettier --write packages/contracts/scripts/generate.ts packages/contracts/scripts/generate.spec.ts packages/contracts/scripts/check-compatibility.ts packages/contracts/scripts/check-compatibility.spec.ts
      - run: pnpm contracts:generate
      - run: pnpm nx test contracts
      - run: pnpm contracts:check
      - run: pnpm contracts:compat
      - run: pnpm format:check
      - run: pnpm typecheck

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/scripts packages/contracts/src/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve required OpenAPI inputs"
          git push origin HEAD:agent/add-openapi-contract-foundation
