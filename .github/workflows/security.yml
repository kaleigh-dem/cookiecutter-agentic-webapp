name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  apply-p13-03:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/p13-03-ci-reliability'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p13-03-ci-reliability
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply P13-03
        run: python3 tools/delivery/apply-p13-03.py

      - run: pnpm install --frozen-lockfile

      - name: Format focused files
        run: >-
          pnpm exec prettier --write
          .github/workflows/ci.yml
          .github/workflows/delivery.yml
          .github/workflows/generated-workspace.yml
          .github/workflows/security.yml
          apps/api/project.json
          apps/web/project.json
          apps/worker/project.json
          docs/TODO.md
          docs/adr/0015-ci-cancellation-caching-and-diagnostics.md
          docs/delivery/containers-and-configuration.md
          packages/web/features/agent-tasks/playwright.config.ts
          tools/delivery/build-container.mjs
          tools/delivery/build-container.spec.mjs
          tools/delivery/ci-reliability.spec.ts
          tools/delivery/load-test.mjs
          tools/delivery/load-test.spec.mjs

      - name: Run deterministic checks
        run: |
          set -euo pipefail
          node --check tools/delivery/build-container.mjs
          node --check tools/delivery/load-test.mjs
          pnpm delivery:check
          pnpm nx test delivery --skip-nx-cache
          pnpm nx lint delivery --skip-nx-cache
          rm tools/delivery/apply-p13-03.py
          git branch --force main origin/main
          pnpm format:check
          git diff --check

      - name: Commit focused implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: improve cancellation caching and diagnostics'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:agent/p13-03-ci-reliability

  package-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency vulnerabilities
        run: pnpm security:audit
      - name: Enforce production dependency licenses
        run: pnpm security:licenses

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Scan tracked files for credential patterns
        run: node tools/security/check-secrets.mjs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.4
