name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  package-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency vulnerabilities
        run: pnpm security:audit
      - name: Enforce production dependency licenses
        run: pnpm security:licenses

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Scan tracked files for credential patterns
        run: node tools/security/check-secrets.mjs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.4

  apply-p13-02-review-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/wiki-supply-chain-promotion'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/wiki-supply-chain-promotion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewer findings
        run: python3 tools/delivery/apply-p13-02-review-fix.py

      - run: pnpm install --frozen-lockfile

      - name: Format focused files
        run: >-
          pnpm exec prettier --write
          .github/workflows/release.yml
          apps/api/project.json
          apps/worker/project.json
          apps/web/project.json
          docs/delivery/releases-and-previews.md
          infra/docker/Dockerfile.node-service
          infra/docker/Dockerfile.web
          tools/delivery/release-image-recovery.mjs
          tools/delivery/release-image-recovery.spec.mjs
          tools/delivery/release-promotion.spec.ts
          wiki/Image-Supply-Chain.md
          wiki/Releases-and-Upgrades.md

      - name: Run deterministic checks
        run: |
          node --check tools/delivery/release-image-recovery.mjs
          pnpm delivery:check
          pnpm nx test delivery --skip-nx-cache
          pnpm nx lint delivery --skip-nx-cache
          git checkout origin/main -- .github/workflows/security.yml
          rm .github/workflows/p13-02-release-recovery-hardening.yml
          rm .github/workflows/p13-02-release-recovery-push.yml
          rm .github/p13-02-release-recovery-trigger
          rm tools/delivery/apply-p13-02-review-fix.py
          git branch --force main origin/main
          pnpm format:check

      - name: Commit review fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(delivery): bind release recovery identity'
          git push origin HEAD:agent/wiki-supply-chain-promotion
