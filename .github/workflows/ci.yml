name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-telemetry:
    if: >-
      github.event.pull_request.head.ref == 'agent/finish-phase-7-telemetry' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/finish-phase-7-telemetry
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm nx sync
      - run: pnpm format
      - run: pnpm telemetry:check

      - name: Commit normalized workspace files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(telemetry): normalize workspace"
          git push origin HEAD:agent/finish-phase-7-telemetry
