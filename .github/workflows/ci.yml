name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx sync:check
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify local generators resolve
        run: |
          pnpm nx g @agentic-webapp/workspace-plugin:domain smoke-domain --dry-run --skipFormat
          pnpm nx g @agentic-webapp/workspace-plugin:feature smoke-feature --dry-run --skipFormat
          pnpm nx g @agentic-webapp/workspace-plugin:job smoke-job --dry-run --skipFormat
          pnpm nx g @agentic-webapp/workspace-plugin:contract smoke-contract --dry-run --skipFormat
      - name: Verify validation leaves the checkout clean
        run: git diff --exit-code
      - run: pnpm nx affected -t lint test
