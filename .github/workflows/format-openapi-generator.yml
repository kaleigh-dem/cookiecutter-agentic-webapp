name: Format OpenAPI generator

on:
  push:
    branches: [agent/add-openapi-contract-foundation]

permissions:
  contents: write

concurrency:
  group: format-openapi-generator
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/scripts/generate.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/scripts/generate.ts
          git commit -m "Format OpenAPI generator source"
          git push origin HEAD:agent/add-openapi-contract-foundation
