name: Finalize release record

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published semantic release version
        required: true
        type: string
      source_run_id:
        description: Successful Release images workflow run ID
        required: true
        type: string
      promotion_run_id:
        description: Successful Promote release digests workflow run ID
        required: true
        type: string
      backup_identifier:
        description: Provider-specific backup or snapshot identifier captured before migrations
        required: true
        type: string
      backup_captured_at:
        description: Backup capture time as an ISO-8601 timestamp with timezone
        required: true
        type: string
      rollback_window_minutes:
        description: Required rollback observation window in minutes
        required: true
        default: '60'
        type: string
      schema_compatibility:
        description: Can the previous approved application digests run against the deployed schema?
        required: true
        type: choice
        options:
          - backward-compatible
          - roll-forward-only
      schema_decision:
        description: Recorded rationale for the schema compatibility decision
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: release-record-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Finalize release record must be dispatched from refs/heads/main.' >&2
            exit 1
          fi

  finalize:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECORD_DIRECTORY: ${{ runner.temp }}/release-record
      RELEASE_MANIFEST: ${{ runner.temp }}/release-record/release-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate source and promotion workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RECORD_DIRECTORY"
          for run_id in "$SOURCE_RUN_ID" "$PROMOTION_RUN_ID"; do
            case "$run_id" in
              ''|*[!0-9]*) echo 'Workflow run IDs must be positive integers.' >&2; exit 1 ;;
            esac
          done

          gh run view "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,event,conclusion,headSha,url \
            > "$RECORD_DIRECTORY/release-run.json"
          gh run view "$PROMOTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,event,conclusion,headSha,url \
            > "$RECORD_DIRECTORY/promotion-run.json"

          node --input-type=module - \
            "$RECORD_DIRECTORY/release-run.json" \
            "$RECORD_DIRECTORY/promotion-run.json" <<'NODE'
          import { readFile } from 'node:fs/promises';

          const [release, promotion] = await Promise.all(
            process.argv.slice(2).map(async (path) =>
              JSON.parse(await readFile(path, 'utf8')),
            ),
          );
          const expectedRuns = [
            [release, 'Release images'],
            [promotion, 'Promote release digests'],
          ];
          for (const [run, workflowName] of expectedRuns) {
            const expected = {
              workflowName,
              headBranch: 'main',
              event: 'workflow_dispatch',
              conclusion: 'success',
            };
            for (const [key, value] of Object.entries(expected)) {
              if (run[key] !== value) {
                throw new Error(
                  `${workflowName} ${key} must be ${value}, received ${run[key] ?? '<missing>'}.`,
                );
              }
            }
            if (!/^[a-f0-9]{40}$/u.test(run.headSha ?? '')) {
              throw new Error(`${workflowName} must expose a full lowercase head SHA.`);
            }
          }
          NODE

      - name: Download approved production promotion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-promotion-${{ inputs.version }}
          path: ${{ env.RECORD_DIRECTORY }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}

      - name: Download image supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-supply-chain-${{ inputs.version }}
          path: ${{ env.RECORD_DIRECTORY }}/image-supply-chain
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate immutable release identity
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          release_head_sha=$(node --input-type=module - "$RECORD_DIRECTORY/release-run.json" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const run = JSON.parse(await readFile(process.argv[2], 'utf8'));
          process.stdout.write(run.headSha);
          NODE
          )
          node tools/delivery/release-manifest.mjs validate \
            --manifest "$RELEASE_MANIFEST" \
            --expected-version "${{ inputs.version }}" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-commit-sha "$release_head_sha"
          node tools/delivery/release-manifest.mjs export-env \
            --manifest "$RELEASE_MANIFEST" \
            --github-env "$GITHUB_ENV"

      - name: Materialize protected production environment
        env:
          PRODUCTION_ENVIRONMENT: ${{ secrets.PRODUCTION_ENVIRONMENT }}
        run: |
          if [ -z "${PRODUCTION_ENVIRONMENT:-}" ]; then
            echo 'The production GitHub Environment must provide PRODUCTION_ENVIRONMENT.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$PRODUCTION_ENVIRONMENT" > "$RUNNER_TEMP/production.env"

      - name: Validate deployed configuration
        run: >-
          pnpm production:check -- "$RUNNER_TEMP/production.env"
          --compare-release-environment

      - name: Authenticate to GHCR for verification
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Capture signature and attestation verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RECORD_DIRECTORY/attestations"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          for service in api worker web; do
            variable="${service^^}_IMAGE"
            reference="${!variable}"
            {
              echo "subject=$reference"
              cosign verify "$reference" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity "$identity"
              gh attestation verify "oci://$reference" --repo "$GITHUB_REPOSITORY"
              gh attestation verify "oci://$reference" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://spdx.dev/Document/v2.3
            } > "$RECORD_DIRECTORY/attestations/${service}.txt"
          done

      - name: Materialize migration plan evidence
        run: |
          node --input-type=module - \
            "$RECORD_DIRECTORY/release-plan.production.json" \
            "$RECORD_DIRECTORY/migration-plan.production.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const [input, output] = process.argv.slice(2);
          const releasePlan = JSON.parse(await readFile(input, 'utf8'));
          const migrationStepIds = new Set([
            'capture-backup',
            'inspect-migrations',
            'apply-migrations',
          ]);
          const orderedSteps = releasePlan.orderedSteps.filter((step) =>
            migrationStepIds.has(step.id),
          );
          if (orderedSteps.length !== migrationStepIds.size) {
            throw new Error('Production release plan is missing migration evidence steps.');
          }
          await writeFile(
            output,
            `${JSON.stringify(
              {
                schemaVersion: 1,
                version: releasePlan.version,
                sourceReleasePlan: 'release-plan.production.json',
                orderedSteps,
              },
              null,
              2,
            )}\n`,
          );
          NODE

      - name: Run deployed release smoke test
        id: smoke
        run: |
          set -euo pipefail
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          (
            set -a
            . "$RUNNER_TEMP/production.env"
            set +a
            node tools/delivery/smoke-test.mjs --profile release
          ) > "$RECORD_DIRECTORY/smoke-test.log" 2>&1
          status=$?
          set -e
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SMOKE_STATUS=$status \
          SMOKE_STARTED_AT=$started_at \
          SMOKE_COMPLETED_AT=$completed_at \
          node --input-type=module - "$RECORD_DIRECTORY/smoke-test.json" <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const status = Number(process.env.SMOKE_STATUS);
          await writeFile(
            process.argv[2],
            `${JSON.stringify(
              {
                schemaVersion: 1,
                profile: 'release',
                status: status === 0 ? 'passed' : 'failed',
                exitCode: status,
                startedAt: process.env.SMOKE_STARTED_AT,
                completedAt: process.env.SMOKE_COMPLETED_AT,
                log: 'smoke-test.log',
              },
              null,
              2,
            )}\n`,
          );
          NODE
          cat "$RECORD_DIRECTORY/smoke-test.log"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Create and validate release record
        env:
          BACKUP_CAPTURED_AT: ${{ inputs.backup_captured_at }}
          BACKUP_IDENTIFIER: ${{ inputs.backup_identifier }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          ROLLBACK_WINDOW_MINUTES: ${{ inputs.rollback_window_minutes }}
          SCHEMA_COMPATIBILITY: ${{ inputs.schema_compatibility }}
          SCHEMA_DECISION: ${{ inputs.schema_decision }}
          SMOKE_COMPLETED_AT: ${{ steps.smoke.outputs.completed_at }}
        run: |
          set -euo pipefail
          decision_recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node tools/delivery/release-record.mjs create \
            --manifest "$RELEASE_MANIFEST" \
            --base-directory "$RECORD_DIRECTORY" \
            --output "$RECORD_DIRECTORY/release-record.json" \
            --promotion-run-id "$PROMOTION_RUN_ID" \
            --backup-identifier "$BACKUP_IDENTIFIER" \
            --backup-captured-at "$BACKUP_CAPTURED_AT" \
            --rollback-window-minutes "$ROLLBACK_WINDOW_MINUTES" \
            --schema-compatibility "$SCHEMA_COMPATIBILITY" \
            --schema-decision "$SCHEMA_DECISION" \
            --decision-owner "$GITHUB_ACTOR" \
            --decision-recorded-at "$decision_recorded_at" \
            --smoke-completed-at "$SMOKE_COMPLETED_AT" \
            --release-plan release-plan.production.json \
            --migration-plan migration-plan.production.json \
            --smoke-result smoke-test.json \
            --api-sbom image-supply-chain/api.spdx.json \
            --worker-sbom image-supply-chain/worker.spdx.json \
            --web-sbom image-supply-chain/web.spdx.json \
            --api-attestation attestations/api.txt \
            --worker-attestation attestations/worker.txt \
            --web-attestation attestations/web.txt
          node tools/delivery/release-record.mjs validate \
            --record "$RECORD_DIRECTORY/release-record.json" \
            --manifest "$RELEASE_MANIFEST" \
            --base-directory "$RECORD_DIRECTORY"

      - name: Upload finalized release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-record-${{ inputs.version }}
          path: ${{ env.RECORD_DIRECTORY }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed finalization evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-record-failure-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ env.RECORD_DIRECTORY }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize finalized release record
        run: |
          {
            echo '## Finalized production release record'
            echo
            echo "- Release images run: \`${{ inputs.source_run_id }}\`"
            echo "- Production promotion run: \`${{ inputs.promotion_run_id }}\`"
            echo "- Backup identifier: \`${{ inputs.backup_identifier }}\`"
            echo "- Schema compatibility: \`${{ inputs.schema_compatibility }}\`"
            echo "- Rollback window: \`${{ inputs.rollback_window_minutes }} minutes\`"
            echo '- Smoke profile: `release` (passed)'
            echo
            echo 'Persist the complete release-record artifact in the deployment system of record before workflow-artifact retention expires.'
          } >> "$GITHUB_STEP_SUMMARY"
