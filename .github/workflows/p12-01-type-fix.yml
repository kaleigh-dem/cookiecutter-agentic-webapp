name: P12-01 type fix

on:
  pull_request:
    paths:
      - .github/workflows/p12-01-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply compiler fixes and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/app/security/oidc-access-token-verifier.ts')
          content = path.read_text()
          content = content.replace(
              "export type OidcFetch = (\n  input: URL | RequestInfo,\n  init?: RequestInit,\n) => Promise<Response>;",
              "export type OidcFetch = (\n  input: URL,\n  init?: RequestInit,\n) => Promise<Response>;",
          )
          content = content.replace(
              "  const [encodedHeader, encodedPayload, encodedSignature] = segments;",
              "  const [encodedHeader, encodedPayload, encodedSignature] = segments as [\n    string,\n    string,\n    string,\n  ];",
          )
          path.write_text(content)
          PY
          rm .github/workflows/p12-01-type-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/app/security/oidc-access-token-verifier.ts .github/workflows/p12-01-type-fix.yml
          git commit -m "fix: satisfy OIDC verifier types"
          git push
