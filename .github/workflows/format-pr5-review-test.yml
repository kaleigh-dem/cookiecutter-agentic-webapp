name: Format PR 5 review test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-pr5-review-test
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'agent/add-openapi-contract-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/scripts/generate.spec.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/scripts/generate.spec.ts
          git commit -m "Format generator regression test"
          git push origin HEAD:agent/add-openapi-contract-foundation
