name: Run P13-02 release recovery hardening

on:
  push:
    branches:
      - agent/wiki-supply-chain-promotion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/wiki-supply-chain-promotion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Execute staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/p13-02-release-recovery-hardening.yml').read_text()
          marker = '      - name: Apply reviewer findings\n        shell: bash\n        run: |\n'
          start = source.find(marker)
          if start < 0:
              raise SystemExit('staged patch marker not found')
          start += len(marker)
          end_marker = '\n      - run: pnpm install --frozen-lockfile\n'
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('staged patch end marker not found')
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-release-recovery.sh').write_text(script)
          PY
          bash /tmp/apply-release-recovery.sh

      - run: pnpm install --frozen-lockfile

      - name: Format focused files
        run: >-
          pnpm exec prettier --write
          .github/workflows/release.yml
          apps/api/project.json
          apps/worker/project.json
          apps/web/project.json
          docs/delivery/releases-and-previews.md
          infra/docker/Dockerfile.node-service
          infra/docker/Dockerfile.web
          tools/delivery/release-image-recovery.mjs
          tools/delivery/release-image-recovery.spec.mjs
          tools/delivery/release-promotion.spec.ts
          wiki/Image-Supply-Chain.md
          wiki/Releases-and-Upgrades.md

      - name: Run deterministic checks
        run: |
          node --check tools/delivery/release-image-recovery.mjs
          pnpm delivery:check
          pnpm nx test delivery --skip-nx-cache
          pnpm nx lint delivery --skip-nx-cache
          rm .github/workflows/p13-02-release-recovery-hardening.yml
          rm .github/workflows/p13-02-release-recovery-push.yml
          rm .github/p13-02-release-recovery-trigger
          git branch --force main origin/main
          pnpm format:check

      - name: Commit review fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(delivery): bind release recovery identity'
          git push origin HEAD:agent/wiki-supply-chain-promotion
