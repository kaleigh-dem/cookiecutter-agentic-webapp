name: Format diagnostic

on:
  push:
    branches: [agent/phase-8-auth-security]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: format Phase 8 files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-8-auth-security
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format flagged files
        run: pnpm format
      - name: Commit formatting changes
        run: |
          git add \
            apps/api/src/app/security/security.module.ts \
            docs/security/threat-model.md \
            packages/web/features/agent-tasks/src/lib/authentication.ts \
            tools/security/check-audit.mjs \
            tools/security/check-licenses.mjs \
            tools/security/check-secrets.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style: format Phase 8 files'
          git push origin HEAD:agent/phase-8-auth-security
