name: Format diagnostic

on:
  push:
    branches: [agent/phase-8-auth-security]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show formatting patch
        run: |
          pnpm exec prettier --write packages/web/features/agent-tasks/scripts/start-test-server.mjs
          git diff -- packages/web/features/agent-tasks/scripts/start-test-server.mjs
