name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            tools/delivery/production-readiness.mjs \
            tools/delivery/production-readiness.spec.ts
          git diff -- \
            tools/delivery/production-readiness.mjs \
            tools/delivery/production-readiness.spec.ts
          exit 1
