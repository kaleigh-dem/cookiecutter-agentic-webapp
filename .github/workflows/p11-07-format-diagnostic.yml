name: P11-07 format diagnostic

on:
  pull_request:
    paths:
      - tools/delivery/smoke-test.mjs
      - .github/workflows/p11-07-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted smoke test
        run: pnpm exec prettier tools/delivery/smoke-test.mjs
