      - name: Format and test model boundary
        run: |
          pnpm exec prettier --write \
            packages/backend/model/src/adapters/openai-model-adapter.ts \
            packages/backend/model/src/adapters/openai-model-adapter.spec.ts \
            packages/backend/model/src/adapters/deterministic-model-adapter.ts \
            packages/backend/model/src/adapters/deterministic-model-adapter.spec.ts
          pnpm nx run backend-model:test
          pnpm nx run backend-model:typecheck
      - name: Commit review fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p14-02-review-fix.yml
          git add \
            packages/backend/model/src/adapters/openai-model-adapter.ts \
            packages/backend/model/src/adapters/openai-model-adapter.spec.ts \
            packages/backend/model/src/adapters/deterministic-model-adapter.ts \
            packages/backend/model/src/adapters/deterministic-model-adapter.spec.ts
          git commit -m 'fix(model): address P14-02 review findings'
          git push origin HEAD:agent/p14-02-model-interfaces
