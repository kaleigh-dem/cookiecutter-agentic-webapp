          replace_once(
              'packages/backend/model/src/adapters/openai-model-adapter.ts',
              """      if (streamAbort.timedOut()) {
        throw new ModelError('Model stream timed out.', {
          code: 'timeout',
          retryable: true,
          provider: this.provider,
          cause: error,
        });
      }
      throw error;
""",
              """      if (streamAbort.timedOut()) {
