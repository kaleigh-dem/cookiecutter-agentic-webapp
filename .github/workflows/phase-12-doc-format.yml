name: Phase 12 document format

on:
  push:
    branches:
      - agent/close-phase-12-exit-criteria
    paths:
      - .github/workflows/phase-12-doc-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/close-phase-12-exit-criteria
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/security/phase-12-validation.md
      - name: Commit formatted document and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/security/phase-12-validation.md
          git rm .github/workflows/phase-12-doc-format.yml
          git commit -m "docs: format Phase 12 validation matrix"
          git push
