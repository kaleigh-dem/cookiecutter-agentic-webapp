name: Address PR 5 review comments

on:
  push:
    branches: [agent/add-openapi-contract-foundation]

permissions:
  contents: write

concurrency:
  group: address-pr5-comments
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-openapi-contract-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply review fixes and regression tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path.cwd()
          branch_files = root / 'packages/contracts'

          compatibility = branch_files / 'scripts/check-compatibility.ts'
          text = compatibility.read_text()
          text = text.replace(
              "const baselinePath = path.join(packageRoot, 'openapi/baseline/openapi.json');\nconst currentPath = path.join(packageRoot, 'openapi/generated/openapi.json');",
              "const baselinePath = path.resolve(\n  process.env.OPENAPI_BASELINE_PATH ??\n    path.join(packageRoot, 'openapi/baseline/openapi.json'),\n);\nconst currentPath = path.resolve(\n  process.env.OPENAPI_CURRENT_PATH ??\n    path.join(packageRoot, 'openapi/generated/openapi.json'),\n);",
          )
          old_parameter_logic = """  const currentByKey = new Map(
            currentParameters
              .map((parameter) => [parameterKey(parameter), parameter] as const)
              .filter(
                (entry): entry is readonly [string, JsonValue] =>
                  entry[0] !== undefined,
              ),
          );

          for (const baselineParameter of baselineParameters) {
            const key = parameterKey(baselineParameter);
            if (key && !currentByKey.has(key)) {
              issues.push(`${operationLabel} removed parameter ${key}.`);
            }
          }

          const baselineKeys = new Set(
            baselineParameters
              .map(parameterKey)
              .filter((key): key is string => key !== undefined),
          );
          for (const currentParameter of currentParameters) {
            const key = parameterKey(currentParameter);
            if (
              key &&
              !baselineKeys.has(key) &&
              isObject(currentParameter) &&
              currentParameter.required === true
            ) {
              issues.push(`${operationLabel} added required parameter ${key}.`);
            }
          }
          """
          new_parameter_logic = """  const parametersByKey = (parameters: JsonValue[]) =>
            new Map(
              parameters
                .map((parameter) => [parameterKey(parameter), parameter] as const)
                .filter(
                  (entry): entry is readonly [string, JsonValue] =>
                    entry[0] !== undefined,
                ),
            );

          const baselineByKey = parametersByKey(baselineParameters);
          const currentByKey = parametersByKey(currentParameters);

          for (const [key] of baselineByKey) {
            if (!currentByKey.has(key)) {
              issues.push(`${operationLabel} removed parameter ${key}.`);
            }
          }

          for (const [key, currentParameter] of currentByKey) {
            if (!isObject(currentParameter) || currentParameter.required !== true) {
              continue;
            }

            const baselineParameter = baselineByKey.get(key);
            if (baselineParameter === undefined) {
              issues.push(`${operationLabel} added required parameter ${key}.`);
            } else if (
              !isObject(baselineParameter) ||
              baselineParameter.required !== true
            ) {
              issues.push(`${operationLabel} made parameter ${key} required.`);
            }
          }
          """
          if old_parameter_logic in text:
              text = text.replace(old_parameter_logic, new_parameter_logic)
          elif 'made parameter ${key} required' not in text:
              raise SystemExit('parameter compatibility block did not match')

          old_schema_tail = """    for (const propertyName of Object.keys(baselineProperties)) {
              if (!(propertyName in currentProperties)) {
                issues.push(
                  `Component schema ${schemaName} removed property ${propertyName}.`,
                );
              }
            }

            const baselineEnum = Array.isArray(baselineSchemaValue.enum)
          """
          new_schema_tail = """    for (const propertyName of Object.keys(baselineProperties)) {
              if (!(propertyName in currentProperties)) {
                issues.push(
                  `Component schema ${schemaName} removed property ${propertyName}.`,
                );
              }
            }

            const baselineRequired = new Set(
              Array.isArray(baselineSchemaValue.required)
                ? baselineSchemaValue.required.filter(
                    (property): property is string => typeof property === 'string',
                  )
                : [],
            );
            const currentRequired = Array.isArray(currentSchemaValue.required)
              ? currentSchemaValue.required.filter(
                  (property): property is string => typeof property === 'string',
                )
              : [];
            for (const propertyName of currentRequired) {
              if (
                propertyName in baselineProperties &&
                !baselineRequired.has(propertyName)
              ) {
                issues.push(
                  `Component schema ${schemaName} made property ${propertyName} required.`,
                );
              }
            }

            const baselineEnum = Array.isArray(baselineSchemaValue.enum)
          """
          if old_schema_tail in text:
              text = text.replace(old_schema_tail, new_schema_tail)
          elif 'made property ${propertyName} required' not in text:
              raise SystemExit('schema compatibility block did not match')
          compatibility.write_text(text)

          generator = branch_files / 'scripts/generate.ts'
          text = generator.read_text()
          text = text.replace(
              "const packageRoot = path.resolve(process.cwd(), 'packages/contracts');",
              "const packageRoot = path.resolve(\n  process.env.CONTRACTS_PACKAGE_ROOT ??\n    path.join(process.cwd(), 'packages/contracts'),\n);",
          )
          marker = """function collectOperations(document: JsonObject): OpenApiOperation[] {
          """
          helpers = """function resolveLocalReference(
            document: JsonObject,
            value: JsonValue,
            label: string,
            stack: string[] = [],
          ): JsonObject {
            const object = asObject(value, label);
            const reference = object.$ref;
            if (typeof reference !== 'string') {
              return object;
            }
            if (!reference.startsWith('#')) {
              throw new Error(`Unresolved external reference in ${label}: ${reference}`);
            }
            if (stack.includes(reference)) {
              throw new Error(`Circular local reference in ${label}: ${reference}`);
            }

            const target = resolveLocalReference(
              document,
              resolveJsonPointer(document, reference.slice(1)),
              label,
              [...stack, reference],
            );
            const siblings = Object.fromEntries(
              Object.entries(object).filter(([key]) => key !== '$ref'),
            ) as JsonObject;
            return { ...target, ...siblings };
          }

          function parameterKey(parameter: JsonObject): string {
            const name = parameter.name;
            const location = parameter.in;
            if (typeof name !== 'string' || typeof location !== 'string') {
              throw new Error('OpenAPI parameters require string name and in fields.');
            }
            return `${location}:${name}`;
          }

          function collectEffectiveParameters(
            document: JsonObject,
            pathItem: JsonObject,
            operation: JsonObject,
            operationLabel: string,
          ): JsonObject[] {
            const parametersByKey = new Map<string, JsonObject>();
            const parameterSources = [pathItem.parameters, operation.parameters];

            for (const parameterSource of parameterSources) {
              if (!Array.isArray(parameterSource)) {
                continue;
              }
              for (const parameterValue of parameterSource) {
                const parameter = resolveLocalReference(
                  document,
                  parameterValue,
                  `${operationLabel} parameter`,
                );
                parametersByKey.set(parameterKey(parameter), parameter);
              }
            }

            return [...parametersByKey.values()];
          }

          function collectOperations(document: JsonObject): OpenApiOperation[] {
          """
          if marker in text and 'function resolveLocalReference(' not in text:
              text = text.replace(marker, helpers)

          text = text.replace(
              "    const pathItem = asObject(pathItemValue, `Path item ${routePath}`);",
              "    const pathItem = resolveLocalReference(\n      document,\n      pathItemValue,\n      `Path item ${routePath}`,\n    );",
          )
          text = text.replace(
              """      const operation = asObject(
                operationValue,
                `Operation ${method.toUpperCase()} ${routePath}`,
              );
              const operationId = operation.operationId;
          """,
              """      const operationLabel = `${method.toUpperCase()} ${routePath}`;
              const operation = resolveLocalReference(
                document,
                operationValue,
                `Operation ${operationLabel}`,
              );
              const operationId = operation.operationId;
          """,
          )
          old_requiredness = """      const parameters = Array.isArray(operation.parameters)
                ? operation.parameters
                : [];
              const hasRequiredParameter = parameters.some((parameter) => {
                if (!isObject(parameter)) {
                  return false;
                }
                return parameter.required === true || parameter.in === 'path';
              });
              const requestBody = operation.requestBody;
              const hasRequiredBody =
                isObject(requestBody) && requestBody.required === true;
              const hasPathTemplate = routePath.includes('{');
          """
          new_requiredness = """      const parameters = collectEffectiveParameters(
                document,
                pathItem,
                operation,
                operationLabel,
              );
              const hasRequiredParameter = parameters.some(
                (parameter) =>
                  parameter.required === true || parameter.in === 'path',
              );
              const requestBody = operation.requestBody;
              const resolvedRequestBody =
                requestBody === undefined
                  ? undefined
                  : resolveLocalReference(
                      document,
                      requestBody,
                      `${operationLabel} request body`,
                    );
              const hasRequiredBody = resolvedRequestBody?.required === true;
              const hasPathTemplate = routePath.includes('{');
          """
          if old_requiredness in text:
              text = text.replace(old_requiredness, new_requiredness)
          elif 'collectEffectiveParameters(' not in text:
              raise SystemExit('generator requiredness block did not match')
          generator.write_text(text)

          project = branch_files / 'project.json'
          text = project.read_text().replace(
              '"command": "vitest run packages/contracts/src"',
              '"command": "vitest run packages/contracts/src packages/contracts/scripts"',
          )
          project.write_text(text)

          (branch_files / 'scripts/check-compatibility.spec.ts').write_text(r'''import { spawnSync } from 'node:child_process';
          import { mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          import { afterEach, describe, expect, it } from 'vitest';

          const scriptPath = fileURLToPath(
            new URL('./check-compatibility.ts', import.meta.url),
          );
          const temporaryDirectories: string[] = [];

          afterEach(async () => {
            await Promise.all(
              temporaryDirectories.splice(0).map((directory) =>
                rm(directory, {
                  force: true,
                  recursive: true,
                }),
              ),
            );
          });

          async function runCompatibility(
            baseline: Record<string, unknown>,
            current: Record<string, unknown>,
          ) {
            const directory = await mkdtemp(
              path.join(tmpdir(), 'contracts-compatibility-'),
            );
            temporaryDirectories.push(directory);
            const baselinePath = path.join(directory, 'baseline.json');
            const currentPath = path.join(directory, 'current.json');
            await Promise.all([
              writeFile(baselinePath, JSON.stringify(baseline), 'utf-8'),
              writeFile(currentPath, JSON.stringify(current), 'utf-8'),
            ]);

            return spawnSync(
              process.execPath,
              ['--import', 'tsx', scriptPath],
              {
                encoding: 'utf-8',
                env: {
                  ...process.env,
                  OPENAPI_BASELINE_PATH: baselinePath,
                  OPENAPI_CURRENT_PATH: currentPath,
                },
              },
            );
          }

          function contract(requiredParameter: boolean, requiredProperty: boolean) {
            return {
              openapi: '3.1.0',
              paths: {
                '/items': {
                  get: {
                    operationId: 'listItems',
                    parameters: [
                      {
                        in: 'query',
                        name: 'limit',
                        required: requiredParameter,
                        schema: { type: 'integer' },
                      },
                    ],
                    responses: {
                      '200': { description: 'ok' },
                    },
                  },
                },
              },
              components: {
                schemas: {
                  CreateItem: {
                    type: 'object',
                    properties: {
                      name: { type: 'string' },
                    },
                    ...(requiredProperty ? { required: ['name'] } : {}),
                  },
                },
              },
            };
          }

          describe('OpenAPI compatibility checks', () => {
            it('rejects an existing optional parameter becoming required', async () => {
              const result = await runCompatibility(
                contract(false, false),
                contract(true, false),
              );

              expect(result.status).toBe(1);
              expect(result.stderr).toContain(
                'GET /items made parameter query:limit required.',
              );
            });

            it('rejects an existing optional schema property becoming required', async () => {
              const result = await runCompatibility(
                contract(false, false),
                contract(false, true),
              );

              expect(result.status).toBe(1);
              expect(result.stderr).toContain(
                'Component schema CreateItem made property name required.',
              );
            });
          });
          ''')

          (branch_files / 'scripts/generate.spec.ts').write_text(r'''import { spawnSync } from 'node:child_process';
          import { mkdir, mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          import { afterEach, describe, expect, it } from 'vitest';

          const scriptPath = fileURLToPath(new URL('./generate.ts', import.meta.url));
          const temporaryDirectories: string[] = [];

          afterEach(async () => {
            await Promise.all(
              temporaryDirectories.splice(0).map((directory) =>
                rm(directory, {
                  force: true,
                  recursive: true,
                }),
              ),
            );
          });

          describe('OpenAPI client generation', () => {
            it(
              'requires request arguments for referenced path-level parameters and request bodies',
              async () => {
                const directory = await mkdtemp(
                  path.join(tmpdir(), 'contracts-generation-'),
                );
                temporaryDirectories.push(directory);
                const sourceDirectory = path.join(directory, 'openapi/source');
                await mkdir(sourceDirectory, { recursive: true });
                await writeFile(
                  path.join(sourceDirectory, 'openapi.json'),
                  JSON.stringify({
                    openapi: '3.1.0',
                    info: { title: 'Fixture API', version: '1.0.0' },
                    paths: {
                      '/items': {
                        parameters: [
                          { $ref: '#/components/parameters/RequiredLimit' },
                        ],
                        get: {
                          operationId: 'listItems',
                          responses: {
                            '200': {
                              description: 'ok',
                              content: {
                                'application/json': {
                                  schema: {
                                    type: 'array',
                                    items: { type: 'string' },
                                  },
                                },
                              },
                            },
                          },
                        },
                      },
                      '/items/create': {
                        post: {
                          operationId: 'createItem',
                          requestBody: {
                            $ref: '#/components/requestBodies/CreateItem',
                          },
                          responses: {
                            '201': {
                              description: 'created',
                              content: {
                                'application/json': {
                                  schema: { type: 'string' },
                                },
                              },
                            },
                          },
                        },
                      },
                    },
                    components: {
                      parameters: {
                        RequiredLimit: {
                          in: 'query',
                          name: 'limit',
                          required: true,
                          schema: { type: 'integer' },
                        },
                      },
                      requestBodies: {
                        CreateItem: {
                          required: true,
                          content: {
                            'application/json': {
                              schema: {
                                type: 'object',
                                properties: {
                                  name: { type: 'string' },
                                },
                              },
                            },
                          },
                        },
                      },
                      schemas: {},
                    },
                  }),
                  'utf-8',
                );

                const result = spawnSync(
                  process.execPath,
                  ['--import', 'tsx', scriptPath],
                  {
                    encoding: 'utf-8',
                    env: {
                      ...process.env,
                      CONTRACTS_PACKAGE_ROOT: directory,
                    },
                  },
                );
                expect(result.status, result.stderr).toBe(0);

                const client = await readFile(
                  path.join(directory, 'src/generated/client.ts'),
                  'utf-8',
                );
                expect(client).toContain(
                  'listItems(request: OperationRequest<operations["listItems"]>)',
                );
                expect(client).toContain(
                  'createItem(request: OperationRequest<operations["createItem"]>)',
                );
                expect(client).not.toContain('listItems(request?:');
                expect(client).not.toContain('createItem(request?:');
                expect(client).not.toContain('listItems(request = {})');
                expect(client).not.toContain('createItem(request = {})');
              },
              30_000,
            );
          });
          ''')
          PY

      - run: pnpm exec prettier --write packages/contracts/scripts/check-compatibility.ts packages/contracts/scripts/generate.ts packages/contracts/scripts/check-compatibility.spec.ts packages/contracts/scripts/generate.spec.ts packages/contracts/project.json
      - run: pnpm nx test contracts
      - run: pnpm contracts:check
      - run: pnpm contracts:compat

      - name: Commit review fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts
          git commit -m "Address OpenAPI review feedback"
          git push origin HEAD:agent/add-openapi-contract-foundation
