name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        type: string
      environment:
        description: Release environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      api_base_url:
        description: Public API URL compiled into the web image
        required: true
        type: string
      authentication_profile:
        description: Production-safe browser authentication profile
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - session
          - none
      auth_session_endpoint:
        description: Same-origin endpoint that returns short-lived browser credentials
        required: true
        default: /auth/session/access-token
        type: string
      push_images:
        description: Push versioned images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ inputs.version }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-api:${{ inputs.version }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-worker:${{ inputs.version }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-web:${{ inputs.version }}
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      NEXT_PUBLIC_AUTHENTICATION_PROFILE: ${{ inputs.authentication_profile }}
      NEXT_PUBLIC_AUTH_SESSION_ENDPOINT: ${{ inputs.auth_session_endpoint }}
      NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialize production environment
        if: inputs.environment == 'production'
        env:
          PRODUCTION_ENVIRONMENT: ${{ secrets.PRODUCTION_ENVIRONMENT }}
        run: |
          if [ -z "${PRODUCTION_ENVIRONMENT:-}" ]; then
            echo "The PRODUCTION_ENVIRONMENT secret is required for production releases." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$PRODUCTION_ENVIRONMENT" > "$RUNNER_TEMP/production.env"

      - name: Validate production readiness
        if: inputs.environment == 'production'
        run: >-
          pnpm production:check -- "$RUNNER_TEMP/production.env"
          --compare-release-environment

      - name: Validate deployed browser authentication
        run: node tools/delivery/validate-browser-auth-build.mjs

      - name: Generate ordered release plan
        run: |
          node tools/delivery/release-plan.mjs \
            --environment "${{ inputs.environment }}" \
            --image-prefix "ghcr.io/${{ github.repository_owner }}/agentic-webapp" \
            --version "${{ inputs.version }}" \
            --output release-plan.json
          cat release-plan.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build versioned images
        run: pnpm containers:build

      - name: Authenticate to GHCR
        if: inputs.push_images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push versioned images
        if: inputs.push_images
        run: |
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"
          docker push "$WEB_IMAGE"
