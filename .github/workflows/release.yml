name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        type: string
      api_base_url:
        description: Production-safe public API URL compiled into the web image
        required: true
        type: string
      authentication_profile:
        description: Production-safe browser authentication profile
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - session
          - none
      auth_session_endpoint:
        description: Same-origin endpoint that returns short-lived browser credentials
        required: true
        default: /auth/session/access-token
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: preview
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-api:${{ inputs.version }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-worker:${{ inputs.version }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-webapp-web:${{ inputs.version }}
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      NEXT_PUBLIC_AUTHENTICATION_PROFILE: ${{ inputs.authentication_profile }}
      NEXT_PUBLIC_AUTH_SESSION_ENDPOINT: ${{ inputs.auth_session_endpoint }}
      NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS: 30
      SUPPLY_CHAIN_DIRECTORY: ${{ runner.temp }}/image-supply-chain
      RELEASE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-images
    steps:
      - uses: actions/checkout@v7

      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Release images must be dispatched from refs/heads/main.' >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release manifest inputs
        run: |
          node tools/delivery/release-manifest.mjs create \
            --version "$APP_VERSION" \
            --source-environment preview \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release.yml \
            --run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --api-name "${API_IMAGE%:*}" \
            --api-digest "sha256:$(printf '0%.0s' {1..64})" \
            --worker-name "${WORKER_IMAGE%:*}" \
            --worker-digest "sha256:$(printf '1%.0s' {1..64})" \
            --web-name "${WEB_IMAGE%:*}" \
            --web-digest "sha256:$(printf '2%.0s' {1..64})" \
            --api-base-url "$NEXT_PUBLIC_API_BASE_URL" \
            --authentication-profile "$NEXT_PUBLIC_AUTHENTICATION_PROFILE" \
            --auth-session-endpoint "$NEXT_PUBLIC_AUTH_SESSION_ENDPOINT" \
            --auth-session-refresh-skew-seconds "$NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS" \
            --output "$RUNNER_TEMP/release-inputs.json"
          rm "$RUNNER_TEMP/release-inputs.json"

      - name: Validate deployed browser authentication
        run: node tools/delivery/validate-browser-auth-build.mjs

      - name: Compute release build identity
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(node tools/delivery/release-image-recovery.mjs fingerprint \
            --api-base-url "$NEXT_PUBLIC_API_BASE_URL" \
            --authentication-profile "$NEXT_PUBLIC_AUTHENTICATION_PROFILE" \
            --auth-session-endpoint "$NEXT_PUBLIC_AUTH_SESSION_ENDPOINT" \
            --auth-session-refresh-skew-seconds "$NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS")
          echo "RELEASE_BUILD_INPUTS_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Inspect release image state
        id: existing-images
        shell: bash
        run: |
          set -euo pipefail
          all_published=true

          for service in api worker web; do
            variable="${service^^}_IMAGE"
            image="${!variable}"

            inspect_error="$RUNNER_TEMP/${service}-manifest-inspect.err"
            if docker manifest inspect "$image" >/dev/null 2>"$inspect_error"; then
              if [ "$GITHUB_RUN_ATTEMPT" = '1' ]; then
                echo "Release image already exists and will not be overwritten: $image" >&2
                echo 'Rerun the original failed Release images workflow to resume a partial publication.' >&2
                exit 1
              fi

              docker pull "$image"
              reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
              name=${reference%@*}
              digest=${reference##*@}
              labels_file="$RUNNER_TEMP/${service}-labels.json"
              docker image inspect --format '{{json .Config.Labels}}' "$image" > "$labels_file"
              node tools/delivery/release-image-recovery.mjs verify-labels \
                --labels-file "$labels_file" \
                --version "$APP_VERSION" \
                --revision "$GITHUB_SHA" \
                --run-id "$GITHUB_RUN_ID" \
                --build-inputs-sha256 "$RELEASE_BUILD_INPUTS_SHA256"

              case "$digest" in
                sha256:*) ;;
                *) echo "Published $service image did not resolve to a sha256 digest." >&2; exit 1 ;;
              esac

              echo "${service}_published=true" >> "$GITHUB_OUTPUT"
              echo "${service}_name=$name" >> "$GITHUB_OUTPUT"
              echo "${service}_digest=$digest" >> "$GITHUB_OUTPUT"
              echo "${service}_scan_ref=$name@$digest" >> "$GITHUB_OUTPUT"
            else
              node tools/delivery/release-image-recovery.mjs assert-manifest-absent \
                --error-file "$inspect_error" \
                --image "$image"
              all_published=false
              echo "${service}_published=false" >> "$GITHUB_OUTPUT"
              echo "${service}_scan_ref=$image" >> "$GITHUB_OUTPUT"
            fi
          done

          echo "all_published=$all_published" >> "$GITHUB_OUTPUT"

      - name: Build versioned images
        if: steps.existing-images.outputs.all_published != 'true'
        run: pnpm containers:build

      - name: Prepare supply-chain output
        run: mkdir -p "$SUPPLY_CHAIN_DIRECTORY"

      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.existing-images.outputs.api_scan_ref }}
          format: spdx-json
          output-file: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/api.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate worker image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.existing-images.outputs.worker_scan_ref }}
          format: spdx-json
          output-file: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/worker.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate web image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.existing-images.outputs.web_scan_ref }}
          format: spdx-json
          output-file: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/web.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.existing-images.outputs.api_scan_ref }}
          format: json
          output: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/api.trivy.json
          scanners: vuln
          exit-code: '0'

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.existing-images.outputs.worker_scan_ref }}
          format: json
          output: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/worker.trivy.json
          scanners: vuln
          exit-code: '0'

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.existing-images.outputs.web_scan_ref }}
          format: json
          output: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/web.trivy.json
          scanners: vuln
          exit-code: '0'

      - name: Enforce image vulnerability policy
        run: >-
          node tools/delivery/image-scan-policy.mjs
          --policy tools/security/image-scan-policy.json
          --report api="$SUPPLY_CHAIN_DIRECTORY/api.trivy.json"
          --report worker="$SUPPLY_CHAIN_DIRECTORY/worker.trivy.json"
          --report web="$SUPPLY_CHAIN_DIRECTORY/web.trivy.json"

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-supply-chain-${{ inputs.version }}
          path: ${{ env.SUPPLY_CHAIN_DIRECTORY }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Push unpublished versioned images
        env:
          API_PUBLISHED: ${{ steps.existing-images.outputs.api_published }}
          WORKER_PUBLISHED: ${{ steps.existing-images.outputs.worker_published }}
          WEB_PUBLISHED: ${{ steps.existing-images.outputs.web_published }}
        run: |
          if [ "$API_PUBLISHED" != 'true' ]; then docker push "$API_IMAGE"; fi
          if [ "$WORKER_PUBLISHED" != 'true' ]; then docker push "$WORKER_IMAGE"; fi
          if [ "$WEB_PUBLISHED" != 'true' ]; then docker push "$WEB_IMAGE"; fi

      - name: Resolve published image digests
        id: digests
        env:
          API_PUBLISHED: ${{ steps.existing-images.outputs.api_published }}
          API_EXISTING_NAME: ${{ steps.existing-images.outputs.api_name }}
          API_EXISTING_DIGEST: ${{ steps.existing-images.outputs.api_digest }}
          WORKER_PUBLISHED: ${{ steps.existing-images.outputs.worker_published }}
          WORKER_EXISTING_NAME: ${{ steps.existing-images.outputs.worker_name }}
          WORKER_EXISTING_DIGEST: ${{ steps.existing-images.outputs.worker_digest }}
          WEB_PUBLISHED: ${{ steps.existing-images.outputs.web_published }}
          WEB_EXISTING_NAME: ${{ steps.existing-images.outputs.web_name }}
          WEB_EXISTING_DIGEST: ${{ steps.existing-images.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            local service=$1
            local image=$2
            local published=$3
            local existing_name=$4
            local existing_digest=$5
            local name digest reference

            if [ "$published" = 'true' ]; then
              name=$existing_name
              digest=$existing_digest
            else
              reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
              name=${reference%@*}
              digest=${reference##*@}
            fi

            case "$digest" in
              sha256:*) ;;
              *) echo "Published $service image did not resolve to a sha256 digest." >&2; exit 1 ;;
            esac
            echo "${service}_name=$name" >> "$GITHUB_OUTPUT"
            echo "${service}_digest=$digest" >> "$GITHUB_OUTPUT"
          }

          resolve_digest api "$API_IMAGE" "$API_PUBLISHED" "$API_EXISTING_NAME" "$API_EXISTING_DIGEST"
          resolve_digest worker "$WORKER_IMAGE" "$WORKER_PUBLISHED" "$WORKER_EXISTING_NAME" "$WORKER_EXISTING_DIGEST"
          resolve_digest web "$WEB_IMAGE" "$WEB_PUBLISHED" "$WEB_EXISTING_NAME" "$WEB_EXISTING_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign published image digests
        env:
          API_REFERENCE: ${{ steps.digests.outputs.api_name }}@${{ steps.digests.outputs.api_digest }}
          WORKER_REFERENCE: ${{ steps.digests.outputs.worker_name }}@${{ steps.digests.outputs.worker_digest }}
          WEB_REFERENCE: ${{ steps.digests.outputs.web_name }}@${{ steps.digests.outputs.web_digest }}
        run: |
          cosign sign --yes "$API_REFERENCE"
          cosign sign --yes "$WORKER_REFERENCE"
          cosign sign --yes "$WEB_REFERENCE"

      - name: Attest API build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.api_name }}
          subject-digest: ${{ steps.digests.outputs.api_digest }}
          push-to-registry: true

      - name: Attest worker build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.worker_name }}
          subject-digest: ${{ steps.digests.outputs.worker_digest }}
          push-to-registry: true

      - name: Attest web build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.web_name }}
          subject-digest: ${{ steps.digests.outputs.web_digest }}
          push-to-registry: true

      - name: Attest API SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.api_name }}
          subject-digest: ${{ steps.digests.outputs.api_digest }}
          sbom-path: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/api.spdx.json
          push-to-registry: true

      - name: Attest worker SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.worker_name }}
          subject-digest: ${{ steps.digests.outputs.worker_digest }}
          sbom-path: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/worker.spdx.json
          push-to-registry: true

      - name: Attest web SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.digests.outputs.web_name }}
          subject-digest: ${{ steps.digests.outputs.web_digest }}
          sbom-path: ${{ env.SUPPLY_CHAIN_DIRECTORY }}/web.spdx.json
          push-to-registry: true

      - name: Create immutable release evidence
        env:
          API_NAME: ${{ steps.digests.outputs.api_name }}
          API_DIGEST: ${{ steps.digests.outputs.api_digest }}
          WORKER_NAME: ${{ steps.digests.outputs.worker_name }}
          WORKER_DIGEST: ${{ steps.digests.outputs.worker_digest }}
          WEB_NAME: ${{ steps.digests.outputs.web_name }}
          WEB_DIGEST: ${{ steps.digests.outputs.web_digest }}
        run: |
          mkdir -p "$RELEASE_EVIDENCE_DIRECTORY"
          node tools/delivery/release-manifest.mjs create \
            --version "$APP_VERSION" \
            --source-environment preview \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release.yml \
            --run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --api-name "$API_NAME" \
            --api-digest "$API_DIGEST" \
            --worker-name "$WORKER_NAME" \
            --worker-digest "$WORKER_DIGEST" \
            --web-name "$WEB_NAME" \
            --web-digest "$WEB_DIGEST" \
            --api-base-url "$NEXT_PUBLIC_API_BASE_URL" \
            --authentication-profile "$NEXT_PUBLIC_AUTHENTICATION_PROFILE" \
            --auth-session-endpoint "$NEXT_PUBLIC_AUTH_SESSION_ENDPOINT" \
            --auth-session-refresh-skew-seconds "$NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS" \
            --output "$RELEASE_EVIDENCE_DIRECTORY/release-manifest.json"
          node tools/delivery/release-manifest.mjs export-env \
            --manifest "$RELEASE_EVIDENCE_DIRECTORY/release-manifest.json" \
            --image-env "$RELEASE_EVIDENCE_DIRECTORY/release-images.env"
          node tools/delivery/release-plan.mjs \
            --environment preview \
            --manifest "$RELEASE_EVIDENCE_DIRECTORY/release-manifest.json" \
            --image-environment-file release-images.env \
            --output "$RELEASE_EVIDENCE_DIRECTORY/release-plan.preview.json"

      - name: Upload immutable release evidence
        id: release-evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-images-${{ inputs.version }}
          path: ${{ env.RELEASE_EVIDENCE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Summarize published release
        env:
          API_REFERENCE: ${{ steps.digests.outputs.api_name }}@${{ steps.digests.outputs.api_digest }}
          WORKER_REFERENCE: ${{ steps.digests.outputs.worker_name }}@${{ steps.digests.outputs.worker_digest }}
          WEB_REFERENCE: ${{ steps.digests.outputs.web_name }}@${{ steps.digests.outputs.web_digest }}
        run: |
          {
            echo '## Published immutable release'
            echo
            echo "- Source workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Release evidence artifact ID: \`${{ steps.release-evidence.outputs.artifact-id }}\`"
            echo "- \`$API_REFERENCE\`"
            echo "- \`$WORKER_REFERENCE\`"
            echo "- \`$WEB_REFERENCE\`"
            echo
            echo 'Promote this release by dispatching **Promote release digests** with the version and source workflow run ID above.'
          } >> "$GITHUB_STEP_SUMMARY"
