name: SteadyStack review fix

on:
  push:
    branches: [agent/steadystack-rebrand]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply requested branding fixes
        run: node tools/template/apply-steadystack-review-fix.mjs

      - name: Commit and expose final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove legacy authentication branding"
          echo "FINAL_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "FINAL_TREE_SHA=$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
