name: Finalize Phase 3

on:
  push:
    branches: [agent/add-workspace-generators]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-workspace-generators

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm nx sync
      - run: pnpm format

      - name: Commit normalized workspace
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Phase 3 workspace"
          git push origin HEAD:agent/add-workspace-generators
