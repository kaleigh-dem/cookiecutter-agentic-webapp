name: Apply P13-02 refresh-skew fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p13-02-digest-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p13-02-digest-promotion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewer finding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('tools/delivery/release-manifest.mjs')
          manifest = manifest_path.read_text()
          marker = """function validateImageName(value, service) {
          """
          insertion = """function validateRefreshSkewSeconds(value) {
            const normalized = requireString(
              value,
              'Build authentication refresh skew seconds',
            );
            if (
              !/^(?:0|[1-9]\\d{0,2})$/u.test(normalized) ||
              Number(normalized) > 300
            ) {
              throw new Error(
                'Build authentication refresh skew seconds must be an integer between 0 and 300.',
              );
            }
            return normalized;
          }

          function validateImageName(value, service) {
          """
          insertion = '\n'.join(line[10:] if line.startswith('          ') else line for line in insertion.splitlines()) + '\n'
          if marker not in manifest:
              raise SystemExit('manifest image validator marker not found')
          manifest = manifest.replace(marker, insertion, 1)

          marker = """  return {
            apiBaseUrl,
            authenticationProfile,
            authSessionEndpoint,
          };
          """
          replacement = """  const authSessionRefreshSkewSeconds = validateRefreshSkewSeconds(
            build.authSessionRefreshSkewSeconds,
          );

          return {
            apiBaseUrl,
            authenticationProfile,
            authSessionEndpoint,
            authSessionRefreshSkewSeconds,
          };
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if marker not in manifest:
              raise SystemExit('manifest build return marker not found')
          manifest = manifest.replace(marker, replacement, 1)

          marker = """    NEXT_PUBLIC_AUTH_SESSION_ENDPOINT: normalized.build.authSessionEndpoint,
          """
          replacement = marker + """    NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS:
              normalized.build.authSessionRefreshSkewSeconds,
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if marker not in manifest:
              raise SystemExit('manifest environment export marker not found')
          manifest = manifest.replace(marker, replacement, 1)

          marker = """      authSessionEndpoint: values['auth-session-endpoint'],
          """
          replacement = marker + """      authSessionRefreshSkewSeconds:
              values['auth-session-refresh-skew-seconds'],
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if marker not in manifest:
              raise SystemExit('manifest create command marker not found')
          manifest_path.write_text(manifest.replace(marker, replacement, 1))

          readiness_path = Path('tools/delivery/production-readiness.mjs')
          readiness = readiness_path.read_text()
          marker = "  'NEXT_PUBLIC_AUTH_SESSION_ENDPOINT',\n"
          replacement = marker + "  'NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS',\n"
          if marker not in readiness:
              raise SystemExit('production compatibility key marker not found')
          readiness_path.write_text(readiness.replace(marker, replacement, 1))

          workflow_path = Path('.github/workflows/release.yml')
          workflow = workflow_path.read_text()
          marker = '            --auth-session-endpoint "$NEXT_PUBLIC_AUTH_SESSION_ENDPOINT" \\\n'
          replacement = marker + '            --auth-session-refresh-skew-seconds "$NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS" \\\n'
          if workflow.count(marker) != 2:
              raise SystemExit('expected two release manifest command markers')
          workflow_path.write_text(workflow.replace(marker, replacement))

          manifest_spec_path = Path('tools/delivery/release-manifest.spec.mjs')
          manifest_spec = manifest_spec_path.read_text()
          marker = "      authSessionEndpoint: '/auth/session/access-token',\n"
          replacement = marker + "      authSessionRefreshSkewSeconds: '30',\n"
          if marker not in manifest_spec:
              raise SystemExit('manifest spec fixture marker not found')
          manifest_spec = manifest_spec.replace(marker, replacement, 1)
          marker = "    expect(entries.NEXT_PUBLIC_API_BASE_URL).toBe('https://api.example.com');\n"
          replacement = marker + "    expect(entries.NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS).toBe(\n      '30',\n    );\n"
          if marker not in manifest_spec:
              raise SystemExit('manifest spec export marker not found')
          manifest_spec = manifest_spec.replace(marker, replacement, 1)
          marker = """    expect(() =>
              validateReleaseManifest({
                ...manifest,
                images: {
                  ...manifest.images,
                  web: undefined,
                },
              }),
            ).toThrow('missing the web image');
          """
          addition = marker + """    expect(() =>
              validateReleaseManifest({
                ...manifest,
                build: {
                  ...manifest.build,
                  authSessionRefreshSkewSeconds: '301',
                },
              }),
            ).toThrow('between 0 and 300');
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          if marker not in manifest_spec:
              raise SystemExit('manifest spec rejection marker not found')
          manifest_spec_path.write_text(manifest_spec.replace(marker, addition, 1))

          plan_spec_path = Path('tools/delivery/release-plan.spec.mjs')
          plan_spec = plan_spec_path.read_text()
          marker = "      authSessionEndpoint: '/auth/session/access-token',\n"
          replacement = marker + "      authSessionRefreshSkewSeconds: '30',\n"
          if marker not in plan_spec:
              raise SystemExit('release plan fixture marker not found')
          plan_spec_path.write_text(plan_spec.replace(marker, replacement, 1))

          readiness_spec_path = Path('tools/delivery/production-readiness.spec.ts')
          readiness_spec = readiness_spec_path.read_text()
          marker = "  NEXT_PUBLIC_AUTH_SESSION_ENDPOINT: '/auth/session/access-token',\n"
          replacement = marker + "  NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS: '30',\n"
          if marker not in readiness_spec:
              raise SystemExit('production fixture marker not found')
          readiness_spec = readiness_spec.replace(marker, replacement, 1)
          marker = """        NEXT_PUBLIC_AUTH_SESSION_ENDPOINT:
              validProduction.NEXT_PUBLIC_AUTH_SESSION_ENDPOINT,
          """
          replacement = marker + """        NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS: '45',
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if marker not in readiness_spec:
              raise SystemExit('release compatibility fixture marker not found')
          readiness_spec = readiness_spec.replace(marker, replacement, 1)
          marker = """      'NEXT_PUBLIC_AUTHENTICATION_PROFILE does not match the release image build configuration.',
            ]);
          """
          replacement = """      'NEXT_PUBLIC_AUTHENTICATION_PROFILE does not match the release image build configuration.',
              'NEXT_PUBLIC_AUTH_SESSION_REFRESH_SKEW_SECONDS does not match the release image build configuration.',
            ]);
          """
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines()) + '\n'
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if marker not in readiness_spec:
              raise SystemExit('release compatibility expectation marker not found')
          readiness_spec_path.write_text(readiness_spec.replace(marker, replacement, 1))

          promotion_spec_path = Path('tools/delivery/release-promotion.spec.ts')
          promotion_spec = promotion_spec_path.read_text()
          marker = "    expect(workflow).toContain('release-manifest.mjs create');\n"
          replacement = marker + "    expect(workflow).toContain('--auth-session-refresh-skew-seconds');\n"
          if marker not in promotion_spec:
              raise SystemExit('promotion workflow contract marker not found')
          promotion_spec_path.write_text(promotion_spec.replace(marker, replacement, 1))

          example_path = Path('infra/release/release-manifest.example.json')
          example = example_path.read_text()
          marker = '    "authSessionEndpoint": "/auth/session/access-token"\n'
          replacement = '    "authSessionEndpoint": "/auth/session/access-token",\n    "authSessionRefreshSkewSeconds": "30"\n'
          if marker not in example:
              raise SystemExit('release manifest example marker not found')
          example_path.write_text(example.replace(marker, replacement, 1))
          PY

      - run: pnpm install --frozen-lockfile

      - name: Format focused files
        run: >-
          pnpm exec prettier --write
          .github/workflows/release.yml
          infra/release/release-manifest.example.json
          tools/delivery/production-readiness.mjs
          tools/delivery/production-readiness.spec.ts
          tools/delivery/release-manifest.mjs
          tools/delivery/release-manifest.spec.mjs
          tools/delivery/release-plan.spec.mjs
          tools/delivery/release-promotion.spec.ts

      - name: Run deterministic checks
        run: |
          pnpm delivery:check
          pnpm nx test delivery --skip-nx-cache
          pnpm nx lint delivery --skip-nx-cache
          rm .github/workflows/p13-02-refresh-skew-fix.yml
          git branch --force main origin/main
          pnpm format:check

      - name: Commit review fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(delivery): preserve browser refresh skew'
          git push origin HEAD:agent/p13-02-digest-promotion
