name: Phase 9 format diagnostic

on:
  pull_request:
    paths:
      - 'tools/delivery/**'
      - '.github/workflows/format-phase9.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show formatting patch
        run: |
          pnpm exec prettier --write tools/delivery
          git diff -- tools/delivery
