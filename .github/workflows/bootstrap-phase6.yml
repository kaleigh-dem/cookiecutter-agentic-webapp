name: Bootstrap Phase 6 reference feature

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/add-agent-task-reference-feature]

permissions:
  contents: write

concurrency:
  group: bootstrap-phase6-reference-feature
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/add-agent-task-reference-feature')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-agent-task-reference-feature
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx g @agentic-webapp/workspace-plugin:domain agent-task --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:feature agent-tasks --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:job execute-agent-task --queue agent-tasks --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:contract agent-task-execution-requested --skipFormat
      - run: pnpm add -Dw @playwright/test
      - run: python tools/phase6-bootstrap.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm contracts:generate
      - run: pnpm nx sync
      - run: pnpm format
      - run: pnpm contracts:check
      - run: pnpm contracts:compat
      - run: pnpm nx sync:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run web-feature-agent-tasks:e2e
      - run: pnpm nx run workspace-plugin:generated-output-smoke
      - run: git diff --check

      - name: Commit Phase 6 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Agent Tasks reference feature"
          git push origin HEAD:agent/add-agent-task-reference-feature
