name: Apply P12-02 prepared edits

on:
  push:
    branches:
      - agent/p12-02-browser-authentication-adapter
    paths:
      - .github/workflows/p12-02-apply.yml
      - tools/p12-02-apply.py
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/p12-02-browser-authentication-adapter'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p12-02-browser-authentication-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/p12-02-apply.py
      - run: |
          pnpm exec prettier --write \
            docs/TODO.md \
            README.md \
            tools/workspace-plugin/src/generators/init/generator.ts \
            tools/workspace-plugin/src/generators/init/generator.spec.ts
      - run: |
          rm .github/workflows/p12-02-apply.yml tools/p12-02-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire generated browser authentication profiles'
          git push origin HEAD:agent/p12-02-browser-authentication-adapter
