name: Bootstrap Phase 6 reference feature v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-phase6-reference-feature-v2
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/add-agent-task-reference-feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/add-agent-task-reference-feature
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx g @agentic-webapp/workspace-plugin:domain agent-task --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:feature agent-tasks --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:job execute-agent-task --queue agent-tasks --skipFormat
      - run: pnpm nx g @agentic-webapp/workspace-plugin:contract agent-task-execution-requested --skipFormat
      - run: pnpm add -Dw @playwright/test
      - run: python tools/phase6-bootstrap.py

      - name: Apply validated bootstrap corrections
        run: |
          python <<'PY'
          from pathlib import Path

          integration = Path('packages/database/src/adapters/agent-task-repository.integration.test.ts')
          integration_text = integration.read_text()
          integration_text = integration_text.replace(
              'stop = () => container.stop();',
              'stop = async () => {\n      await container.stop();\n    };',
          )
          integration.write_text(integration_text)

          controller = Path('apps/api/src/app/agent-tasks/agent-tasks.controller.ts')
          controller_text = controller.read_text()
          old = '''      const task = await this.createAgentTask.execute({
        actorId: requireActor(actorHeader),
        title: body.title,
        prompt: body.prompt,
        correlationId: correlationId?.trim() || undefined,
      });'''
          new = '''      const normalizedCorrelationId = correlationId?.trim();
      const task = await this.createAgentTask.execute({
        actorId: requireActor(actorHeader),
        title: body.title,
        prompt: body.prompt,
        ...(normalizedCorrelationId
          ? { correlationId: normalizedCorrelationId }
          : {}),
      });'''
          if old not in controller_text:
              raise SystemExit('correlation command block did not match')
          controller.write_text(controller_text.replace(old, new, 1))
          PY

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm contracts:generate
      - run: pnpm nx sync
      - run: pnpm format

      - name: Create local Phase 6 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Agent Tasks reference feature"

      - run: pnpm contracts:check
      - run: pnpm contracts:compat
      - run: pnpm nx sync:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run web-feature-agent-tasks:e2e
      - run: pnpm nx run workspace-plugin:generated-output-smoke
      - run: git diff --exit-code

      - name: Push Phase 6 implementation
        run: git push origin HEAD:agent/add-agent-task-reference-feature
