name: Format P11-06

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/p11-06-worker-observability-shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/p11-06-worker-observability-shutdown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/worker/src/delivery/poller-observability.spec.ts
          apps/worker/src/delivery/poller.ts
          apps/worker/src/main.ts
          apps/worker/src/operations.ts
          docs/worker-operations.md
      - name: Commit formatted files
        run: |
          rm .github/workflows/format-p11-06.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format P11-06 implementation"
          git push origin HEAD:agent/p11-06-worker-observability-shutdown
