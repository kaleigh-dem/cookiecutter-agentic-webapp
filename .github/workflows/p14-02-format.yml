name: P14-02 format

on:
  push:
    branches:
      - agent/p14-02-model-interfaces

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/p14-02-model-interfaces

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pinned formatter and remove helper
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            docs/model-interfaces.md \
            packages/backend/model/src/adapters/deterministic-model-adapter.ts \
            packages/backend/model/src/adapters/openai-model-adapter.spec.ts \
            packages/backend/model/src/adapters/openai-model-adapter.ts \
            packages/backend/model/src/lib/model.ts
          rm .github/workflows/p14-02-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(model): apply pinned formatter'
          git push origin HEAD:agent/p14-02-model-interfaces
